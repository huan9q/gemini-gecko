name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Extract Project Files
        run: |
          for zip in *.zip; do
            if [ -f "$zip" ]; then
              echo "Extracting $zip..."
              unzip -o "$zip"
            fi
          done

          if [ -d "android" ]; then
            echo "PROJECT_DIR=android" >> $GITHUB_ENV
          else
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          fi

      - name: Resolve GeckoView & Align SDK Target
        run: |
          cd ${{ env.PROJECT_DIR }}

          # 1. Fetch live latest version from Mozilla Maven metadata
          METADATA_URL="https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-omni/maven-metadata.xml"
          REAL_VERSION=$(curl -sSL "$METADATA_URL" | grep -oPm1 "(?<=<latest>)[^<]+")
          [ -z "$REAL_VERSION" ] && REAL_VERSION=$(curl -sSL "$METADATA_URL" | grep -oPm1 "(?<=<release>)[^<]+")
          echo "Using Mozilla GeckoView: $REAL_VERSION"

          # 2. Add Mozilla repository to settings.gradle.kts
          if [ -f "settings.gradle.kts" ] && ! grep -q "maven.mozilla.org" settings.gradle.kts; then
            sed -i '/repositories {/a \        maven { url = java.net.URI("https://maven.mozilla.org/maven2/") }' settings.gradle.kts
          fi

          # 3. Patch dependency versions
          find . -type f -name "build.gradle.kts" -exec sed -i -E "s/geckoview-omni:[0-9]+(\.[0-9]+)+/geckoview-omni:$REAL_VERSION/g" {} +
          if [ -f "gradle/libs.versions.toml" ]; then
            sed -i -E "s/geckoview = \"[^\"]+\"/geckoview = \"$REAL_VERSION\"/g" gradle/libs.versions.toml
            sed -i -E "s/geckoview-omni:[^\"]+/geckoview-omni:$REAL_VERSION/g" gradle/libs.versions.toml
          fi

          # 4. Bump compileSdk to 36 and suppress SDK check mismatch
          find . -type f -name "build.gradle.kts" -exec sed -i -E 's/compileSdk\s*=\s*[0-9]+/compileSdk = 36/g' {} +
          echo "android.suppressUnsupportedCompileSdk=36" >> gradle.properties

      - name: Build Debug APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GeminiGecko-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
