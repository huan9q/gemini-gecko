name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip Project Files (if zipped)
        run: |
          if [ -f "gemini-gecko-android-project-FINAL.zip" ]; then
            unzip -o gemini-gecko-android-project-FINAL.zip
          elif [ -f "gemini-gecko-android-project.zip" ]; then
            unzip -o gemini-gecko-android-project.zip
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Regenerate Missing Gradle Wrapper JAR
        run: |
          cd android
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Compile Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GeminiGecko-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
