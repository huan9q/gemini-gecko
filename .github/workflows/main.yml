name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Extract Project Files
        run: |
          for zip in *.zip; do
            if [ -f "$zip" ]; then
              echo "Extracting $zip..."
              unzip -o "$zip"
            fi
          done

          if [ -d "android" ]; then
            echo "PROJECT_DIR=android" >> $GITHUB_ENV
          else
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          fi

      - name: Fix GeckoView Dependency & Maven Repository
        run: |
          cd ${{ env.PROJECT_DIR }}

          # 1. Update/Inject Mozilla Maven into settings.gradle.kts if missing
          if [ -f "settings.gradle.kts" ]; then
            if ! grep -q "maven.mozilla.org" settings.gradle.kts; then
              sed -i '/repositories {/a \        maven { url = java.net.URI("https://maven.mozilla.org/maven2/") }' settings.gradle.kts
            fi
          fi

          # 2. Patch any hardcoded versions in build.gradle.kts files
          find . -type f -name "build.gradle.kts" -exec sed -i -E 's/geckoview-omni:[0-9]+(\.[0-9]+)+/geckoview-omni:136.0.20250227124749/g' {} +

          # 3. Patch the version catalog (libs.versions.toml) directly
          if [ -f "gradle/libs.versions.toml" ]; then
            sed -i -E 's/geckoview = "[^"]+"/geckoview = "136.0.20250227124749"/g' gradle/libs.versions.toml
            sed -i -E 's/geckoview-omni:[^"]+/geckoview-omni:136.0.20250227124749/g' gradle/libs.versions.toml
          fi

      - name: Build Debug APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GeminiGecko-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
